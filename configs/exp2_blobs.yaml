experiment:
  name: DQGM
  description: "2D blobs — two-feature joint density estimation."
  save_dir: "./logs/exp2_blobs/"

data:
  dataset: 'blobs'
  num_samples: 100_000
  encoding: "dense"
  seed: 7

model:
  num_visible_per_feature: 9
  num_feature: 2
  num_hidden_shared: 4
  multivariate_bits: False
  init_scale: 3.1415
  init_method: "custom_random"
  freq_buffer: 1
  seed: 4

classical_simulator:
  marginal_estimator_method: "mc"
  num_operators: 1000          # number of random hidden bitstrings per step

training:
  optimizer: "adam"
  learning_rate: 0.01
  batch_size: 64
  decay_rate: 0.999
  transition_steps: 10
  num_steps: 10000
  l1_lambda: 0.0001
  l2_lambda: 0.0001
  log_every: 10
  checkpoint_every: 500
  seed: 4
  print_verbosity: 1   # 1 = show tqdm progress bar
  log_verbosity: 1     # 1 = save parameter snapshots at each checkpoint
